[package]
name = "si-senortn/npc-controller"
description = "Client side of the network optimized NPC system"
version = "0.1.0"
registry = "https://github.com/UpliftGames/wally-index"
realm = "shared"
# Only these paths are uploaded by `wally publish`
include = [
	"src",
	"src/**",
	"default.project.json",
	"wally.toml",
	"README.md",
	"LICENSE",
]

[dependencies]
Signal = "sleitnick/signal@2.0.3"
